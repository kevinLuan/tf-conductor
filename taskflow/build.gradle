dependencies {
    implementation project(':conductor-common')
    implementation project(':conductor-core')
    compileOnly 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation "com.fasterxml.jackson.core:jackson-databind:${revFasterXml}"
    implementation "org.apache.commons:commons-lang3"
    // 阿里通义千问 SDK，仅本模块使用，避免污染 core
    implementation 'com.alibaba:dashscope-sdk-java:2.18.0'

    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.xerial:sqlite-jdbc:3.49.0.0'
    testImplementation project(':conductor-common').sourceSets.test.output
}
